<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Looper hardening vs OKF's CDN build: a strict CSP so the graph renders fully
     offline. `script-src 'self'` (no 'unsafe-inline') is why the bundle data lives in a
     non-executable JSON island below and cytoscape/marked/viz.js load from /viz/. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>OKF Bundle Viewer</title>
<link rel="stylesheet" href="/viz/viz.css">
<script src="/viz/cytoscape.min.js"></script>
<script src="/viz/marked.min.js"></script>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

<!-- Non-executable data island (CSP-safe; viz.js reads + JSON.parses this). -->
<script type="application/json" id="okf-data">__OKF_DATA__</script>
<script src="/viz/viz.js"></script>
</body>
</html>
